appId: com.edelstein.praxis
productName: Praxis
copyright: Copyright © 2026 Michael Edelstein

directories:
  output: release
  buildResources: build

# electron-vite emits to out/; ship that plus package.json. Workspace deps are
# bundled into out/main by electron-vite, so node_modules pruning stays simple.
files:
  - out/**/*
  - package.json

# asarUnpack anything that must stay on disk (none today; npx-launched MCP
# servers run from the user's environment, not from the asar).
asar: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # macOS permission prompt copy. Praxis automates other apps (browser, Finder,
  # Messages) via AppleScript and reads the mic for voice.
  extendInfo:
    NSMicrophoneUsageDescription: Praxis uses your microphone for voice conversation.
    NSAppleEventsUsageDescription: Praxis controls apps like your browser, Finder, and Messages on your behalf.
    NSSystemAdministrationUsageDescription: Praxis automates local applications you ask it to control.
  # Signing/notarization kick in automatically when the env is present:
  #   CSC_LINK / CSC_KEY_PASSWORD  -> Developer ID signing
  #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID -> notarization
  # Without them electron-builder still produces a working (ad-hoc signed) .dmg;
  # Gatekeeper warns on first open (right-click -> Open) and the automation
  # permission prompts still appear normally.

win:
  target:
    - target: nsis
      arch:
        - x64
  # --- Code signing (TODO) --------------------------------------------------
  # Provide CSC_LINK / CSC_KEY_PASSWORD (a .pfx) to sign the installer.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
