# Optional CI deploy, gated behind a repo variable so it never fires unless you
# opt in. Set repo variable DEPLOY_ENABLED=true and the secrets below to use it.
#
# On push to main: build the server image, push to GHCR, then SSH to the VPS and
# `docker compose pull && up -d`. Roll back by re-running with a previous tag.
name: deploy-relay

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-relay
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Only runs when you explicitly enable it.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/praxis-server:latest
            ghcr.io/${{ github.repository }}/praxis-server:${{ github.sha }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/praxis
            export PRAXIS_IMAGE="ghcr.io/${{ github.repository }}/praxis-server:latest"
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
            docker image prune -f
